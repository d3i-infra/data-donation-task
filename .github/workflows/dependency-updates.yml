name: CI

on:
  pull_request:
    branches:
      - master
      - development

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      # The dev group carries pandas-stubs; pandas ships no py.typed, so the
      # "Python typecheck" step below reports import errors without it.
      - name: Install Python dependencies
        run: cd packages/python && poetry install --with test,dev

      - name: Run Python unit tests
        run: cd packages/python && poetry run pytest tests/ -v

      # Only example_config.json is committed (the rest are gitignored, per
      # platform, generated by the researcher), so regenerate every platform's
      # config to stdout first and validate the whole set: schema, extractor
      # registry cross-check, and UI-content locale coverage. Catches a
      # docstring 'Table config::' block that lost its English text before a
      # researcher ever generates from it.
      - name: Validate platform configs
        run: |
          cd packages/python
          for source in port/platforms/*.py; do
            name="$(basename "$source" .py)"
            if [ "$name" != "example" ]; then
              poetry run python ../../scripts/generate_port_config.py "$name" --stdout \
                > "port/configs/${name}_config.json"
            fi
          done
          poetry run python ../../scripts/validate_port_config.py --all --report

      - name: Build feldspar
        run: pnpm run --filter @eyra/feldspar build

      - name: Run JS unit tests
        run: pnpm run test:js

      - name: Python typecheck
        run: pnpm run typecheck:py

      - name: Install adg
        run: curl -fsSL https://raw.githubusercontent.com/daniellemccool/ad-guidance-tool/main/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: ADR checks
        run: adg lean index --model docs/decisions --root . && adg lean check --model docs/decisions
